[project]
name = "assist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saraths3", email = "contactme.saraths@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "celery>=5.7.0",
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "google-genai>=3.5.0",
    "packaging>=26.3",
    "pillow>=13.0.0",
